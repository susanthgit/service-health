name: 🏥 Service Health Tracker

on:
  schedule:
    # Every 2 hours — balances freshness with API courtesy
    - cron: '15 */2 * * *'
  workflow_dispatch:  # Manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 🐍 Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: 🔐 Login to Azure (OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_SH_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_SH_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SH_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: 📡 Fetch service health data
        run: |
          export GRAPH_TOKEN=$(az account get-access-token --resource https://graph.microsoft.com --query accessToken -o tsv)
          python scripts/fetch_health.py

      - name: ☁️ Fetch Azure Status history
        run: python scripts/fetch_azure.py

      - name: 📊 Generate data files
        run: python scripts/generate_data.py

      - name: 💾 Commit generated files
        run: |
          git config user.name "Service Health Bot"
          git config user.email "service-health-bot@aguidetocloud.com"
          git add site/
          git diff --cached --quiet || git commit -m "🏥 Health update — $(date -u +%Y-%m-%dT%H:%M)" --author="Service Health Bot <service-health-bot@aguidetocloud.com>"
          git pull --rebase --strategy-option=theirs || (git rebase --abort && git pull --no-rebase -X theirs)
          git push || true

      - name: 🔄 Update main website with latest data
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/susanthgit/aguidetocloud-revamp.git /tmp/main-site
          mkdir -p /tmp/main-site/static/data/service-health
          mkdir -p /tmp/main-site/static/data/service-health/archive
          mkdir -p /tmp/main-site/static/data/service-health/incidents

          # Copy main data files
          cp site/latest.json /tmp/main-site/static/data/service-health/latest.json
          cp site/stats.json /tmp/main-site/static/data/service-health/stats.json
          cp site/feed.xml /tmp/main-site/static/data/service-health/feed.xml

          # Copy archives and incidents
          [ -d site/archive ] && cp site/archive/*.json /tmp/main-site/static/data/service-health/archive/ 2>/dev/null || true
          [ -d site/incidents ] && cp site/incidents/*.json /tmp/main-site/static/data/service-health/incidents/ 2>/dev/null || true

          cd /tmp/main-site
          git config user.name "Service Health Bot"
          git config user.email "service-health-bot@aguidetocloud.com"
          git add static/data/service-health/
          git diff --cached --quiet || git commit -m "🏥 Service health data update — $(date -u +%Y-%m-%dT%H:%M)"
          git push

      # Git push above triggers Cloudflare Pages auto-build — no manual deploy needed

  # ── On failure: open/comment on issue (de-dup) instead of new issue every run ──
  # Same pattern as aguidetocloud-revamp/.github/workflows/realtime-probe.yml +
  # pipeline-freshness-watchdog.yml. Previously created a NEW issue every 2h
  # failure (10 issues in 3 days on 2026-06-09 → 11 → spammed Gmail). Now:
  # find existing open `pipeline-broken` issue → comment if present,
  # create-once if absent. notify-on-recovery closes the issue on first success.
  notify-on-failure:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    needs: fetch-and-deploy
    if: failure()
    steps:
      - name: 🔎 Find existing open issue
        id: find
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
        run: |
          set +e
          EXISTING=$(gh issue list \
            --repo susanthgit/service-health \
            --state open \
            --label pipeline-broken \
            --json number \
            --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "Found existing issue #$EXISTING — will comment, not create"
          else
            echo "existing=" >> "$GITHUB_OUTPUT"
            echo "No open issue — will create one"
          fi

      - name: 💬 Comment on existing issue
        if: steps.find.outputs.existing != ''
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
          ISSUE: ${{ steps.find.outputs.existing }}
        run: |
          TS=$(date -u +'%Y-%m-%d %H:%M UTC')
          gh issue comment "$ISSUE" \
            --repo susanthgit/service-health \
            --body "🔴 Still failing as of $TS. [Run](https://github.com/susanthgit/service-health/actions/runs/${{ github.run_id }})"

      - name: 🚨 Open new issue
        if: steps.find.outputs.existing == ''
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
        run: |
          gh label create pipeline-broken \
            --repo susanthgit/service-health \
            --color FF0000 \
            --description "Service health pipeline failing" 2>/dev/null || true
          TS=$(date -u +'%Y-%m-%d %H:%M UTC')
          gh issue create \
            --repo susanthgit/service-health \
            --label pipeline-broken \
            --title "🚨 Service health pipeline failing" \
            --body "The service health workflow is failing. This issue auto-updates with each failure and auto-closes on recovery.

          **First detected:** $TS
          **Latest run:** https://github.com/susanthgit/service-health/actions/runs/${{ github.run_id }}"

  # ── On recovery: close any open pipeline-broken issues ──
  notify-on-recovery:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    needs: fetch-and-deploy
    if: success()
    steps:
      - name: 🟢 Close open pipeline-broken issues
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_PAT }}
        run: |
          ISSUES=$(gh issue list \
            --repo susanthgit/service-health \
            --state open \
            --label pipeline-broken \
            --json number \
            --jq '.[].number')
          if [ -z "$ISSUES" ]; then
            echo "No open issues to close — nothing to do"
            exit 0
          fi
          TS=$(date -u +'%Y-%m-%d %H:%M UTC')
          for N in $ISSUES; do
            gh issue comment "$N" --repo susanthgit/service-health \
              --body "🟢 Pipeline recovered at $TS. [Recovery run](https://github.com/susanthgit/service-health/actions/runs/${{ github.run_id }})"
            gh issue close "$N" --repo susanthgit/service-health --reason completed
            echo "Closed #$N"
          done
