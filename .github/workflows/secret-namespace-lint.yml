name: 🔒 Secret namespace lint

# Prevents reintroduction of generic AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID /
# AZURE_SUBSCRIPTION_ID in any workflow file. Born from the 2026-06-05 → 2026-06-11 incident
# where two workflows (service-health.yml + atlas-gw-watchdog.yml) shared the generic name
# AZURE_CLIENT_ID, causing silent OIDC breakage when the secret was repointed for one workflow.
#
# Policy: every workflow MUST use a namespaced secret name (AZURE_SH_*, AZURE_GW_*, etc.)
# so each identity domain is explicit and reconfiguration of one workflow cannot collide
# with another.

on:
  push:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  lint:
    name: Block generic Azure secrets
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for generic Azure secret references
        run: |
          set -euo pipefail
          PATTERN='secrets\.AZURE_(CLIENT_ID|CLIENT_SECRET|TENANT_ID|SUBSCRIPTION_ID)\b'
          VIOLATIONS=$(grep -rEn "$PATTERN" .github/workflows/ .github/actions/ 2>/dev/null || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Generic Azure secret reference detected. Use namespaced names (AZURE_SH_*, AZURE_GW_*, etc.)"
            echo ""
            echo "Violations:"
            echo "$VIOLATIONS"
            echo ""
            echo "===================================================================="
            echo "WHY: When two workflows share a generic 'AZURE_CLIENT_ID' secret with"
            echo "different identity needs, reconfiguring one silently breaks the other."
            echo ""
            echo "This rule was born from the 2026-06-05 → 2026-06-11 incident where"
            echo "atlas-gw-watchdog.yml repointed AZURE_CLIENT_ID for its own SP, silently"
            echo "breaking service-health.yml's OIDC auth. 100+ failure emails over 5 days."
            echo ""
            echo "FIX: rename your workflow's secret refs to a namespaced pattern, e.g."
            echo "  secrets.AZURE_SH_CLIENT_ID  (service-health-specific)"
            echo "  secrets.AZURE_GW_CLIENT_ID  (gateway watchdog-specific)"
            echo "  secrets.AZURE_AI_CLIENT_ID  (ai-news-specific)"
            echo ""
            echo "Then create the corresponding GitHub repo secret with the namespaced name."
            echo "===================================================================="
            exit 1
          fi

          echo "✅ No generic Azure secret references found in workflows/actions."
          echo "   All Azure identity references are namespace-explicit. Good."
